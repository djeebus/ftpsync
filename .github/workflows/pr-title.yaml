# PRs are squash merged using the PR title as the commit title, and auto-release.yaml derives
# versions from those commits, so every PR title must be a conventional commit message
# (https://www.conventionalcommits.org), e.g. "feat: support excluding paths".
name: PR title

on:
  # safe because this workflow never checks out or runs the PR's code
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  lint:
    runs-on: ubuntu-22.04

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
