# cuts a release from conventional commits (https://www.conventionalcommits.org) on every push to main:
#   fix: ...                       -> patch
#   feat: ...                      -> minor
#   feat!: ... / BREAKING CHANGE:  -> major
# commits that don't follow the convention are ignored; if nothing qualifies, no release is made.
name: Auto release

on:
  push:
    branches:
      - main

env:
  FS_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-22.04

    concurrency: release

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v3

      - id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # releases created with GITHUB_TOKEN don't trigger other workflows, so build the image here
      - if: steps.semrel.outputs.version != ''
        uses: ./.github/actions/build-image
        with:
          image: ${{ env.FS_IMAGE }}
          tag: v${{ steps.semrel.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
